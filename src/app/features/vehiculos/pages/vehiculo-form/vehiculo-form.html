<section class="pagina">
  <a class="volver" routerLink="/vehiculos">← Volver a vehículos</a>
  <div class="encabezado">
    <div>
      <p class="etiqueta">Atención al cliente</p>
      <h1>{{ id() ? 'Editar vehículo' : 'Nuevo vehículo' }}</h1>
      <p class="subtitulo">Registra los datos del vehículo y selecciona a su propietario.</p>
    </div>
  </div>
  @if (error()) {
    <div class="alerta" role="alert">{{ error() }}</div>
  }
  @if (cargando()) {
    <p class="estado-pagina">Cargando datos…</p>
  } @else {
    <form class="tarjeta formulario" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
      <div class="campos">
        <div class="campo">
          <label for="placa">Placa *</label
          ><input
            id="placa"
            formControlName="placa"
            placeholder="ABC-123"
            maxlength="7"
          /><app-field-error
            [control]="form.controls.placa"
            [servidor]="errores()['placa']"
            mensaje="Usa tres letras mayúsculas y tres números: ABC-123."
          />
        </div>
        <div class="campo">
          <label for="cliente">Cliente *</label
          ><select id="cliente" formControlName="clienteId">
            <option [ngValue]="null">Selecciona un cliente</option>
            @for (c of clientes(); track c.id) {
              <option [ngValue]="c.id">{{ c.nombres }} · {{ c.documento }}</option>
            }</select
          ><app-field-error
            [control]="form.controls.clienteId"
            [servidor]="errores()['clienteId']"
            mensaje="Selecciona un cliente."
          />
        </div>
        <div class="campo">
          <label for="marca">Marca *</label
          ><input id="marca" formControlName="marca" maxlength="40" /><app-field-error
            [control]="form.controls.marca"
            [servidor]="errores()['marca']"
            mensaje="La marca es obligatoria y admite hasta 40 caracteres."
          />
        </div>
        <div class="campo">
          <label for="modelo">Modelo *</label
          ><input id="modelo" formControlName="modelo" maxlength="40" /><app-field-error
            [control]="form.controls.modelo"
            [servidor]="errores()['modelo']"
            mensaje="El modelo es obligatorio y admite hasta 40 caracteres."
          />
        </div>
        <div class="campo">
          <label for="anio">Año *</label
          ><input
            id="anio"
            type="number"
            formControlName="anio"
            min="1990"
            max="2027"
            step="1"
          /><app-field-error
            [control]="form.controls.anio"
            [servidor]="errores()['anio']"
            mensaje="El año debe estar entre 1990 y 2027."
          />
        </div>
      </div>
      <div class="acciones">
        <button
          class="boton principal"
          type="submit"
          [disabled]="guardando() || !clientes().length"
        >
          {{
            guardando() ? 'Guardando…' : id() ? 'Actualizar vehículo' : 'Registrar vehículo'
          }}</button
        ><a class="boton" routerLink="/vehiculos">Cancelar</a>
      </div>
    </form>
  }
</section>
